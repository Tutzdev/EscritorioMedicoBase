spring.application.name=medical-office-api

server.port=8080

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/medical_office}
spring.datasource.username=${DB_USERNAME:medical_user}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.security.jwt-secret=${JWT_SECRET}
app.security.access-token-expiration=15m
app.security.refresh-token-expiration=7d
app.security.issuer=medical-office-api

app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

app.bootstrap.admin.enabled=${BOOTSTRAP_ADMIN_ENABLED:false}
app.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:}
app.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
app.bootstrap.admin.password=${BOOTSTRAP_ADMIN_PASSWORD:}
