spring.datasource.url=jdbc:h2:mem:medical_office;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

app.security.jwt-secret=test-secret-with-at-least-thirty-two-characters
app.security.access-token-expiration=15m
app.security.refresh-token-expiration=7d
app.security.issuer=medical-office-api-test
app.cors.allowed-origins=http://localhost:5173
app.bootstrap.admin.enabled=false
